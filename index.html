<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Web Design Projects - One build per guide</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fafafa;font-family:-apple-system,Inter,Segoe UI,sans-serif;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:80px 24px}
h1{font-size:clamp(32px,5vw,52px);font-weight:700;letter-spacing:-.02em}
.sub{color:rgba(250,250,250,.55);margin:16px 0 56px;line-height:1.7;max-width:600px}
.sub a{color:#d4ff4f}
.grid{display:grid;gap:14px}
a.card{display:flex;align-items:center;gap:20px;padding:22px 26px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.03);text-decoration:none;color:#fafafa;transition:border-color .25s,transform .25s}
a.card:hover{border-color:#d4ff4f;transform:translateY(-2px)}
.num{font-family:ui-monospace,monospace;color:#d4ff4f;font-size:13px;min-width:28px}
.card h2{font-size:17px;font-weight:600}
.card p{font-size:13px;color:rgba(250,250,250,.5);margin-top:4px}
.arrow{margin-left:auto;color:rgba(250,250,250,.35)}
.soon{opacity:.4;pointer-events:none}
.soon .arrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase}
footer{margin-top:64px;font-size:12px;color:rgba(250,250,250,.35)}
</style>
</head>
<body>
<div class="wrap">
<h1>Twelve guides. Twelve builds.</h1>
<p class="sub">Every project here follows one guide from my <a href="https://raj-microsoft.github.io/ai-web-design-library/">AI web design library</a> - same techniques, my own concepts. Each lives on its own path.</p>
<div class="grid" id="grid"></div>
<footer>Built on GitHub Pages. Source: <a style="color:rgba(250,250,250,.55)" href="https://github.com/raj-microsoft/ai-web-design-projects">github.com/raj-microsoft/ai-web-design-projects</a></footer>
</div>
<script>
const P=[
["01","AURUM - Parfums d'Exception","Guide 01: named libraries, Anime.js springs, scroll reveals under 400ms","01-aurum/",true],
["02","NOCTURNE - Listening Bar","Guide 02: the $10K setup - motion-first, premium components","02-nocturne/",false],
["03","MOSAIC - Moodboard Studio","Guide 03: built in the Google-AI-tools spirit - clean UI, generated feel","03-mosaic/",false],
["04","WADDEN - A Coastal Sketchbook","Guide 04: polaroids, SVG acrylic pages, real page turns","04-wadden/",false],
["05","ORBIT - A Product Film in Frames","Guide 05: Claude Design + HyperFrames pipeline, frame-sequenced motion","05-orbit/",false],
["06","DOT - A 30-Second Film in Code","Guide 06: every scene animated in code, score in WebAudio","06-dot/",false],
["07","AXIOM-1 - Scroll-Exploded Chip","Guide 07: scroll-scrubbed assembled-to-exploded product view","07-axiom/",false],
["08","TIDE - A Harbour That Wakes","Guide 08: scroll-tied video-style hero, canvas frames","08-tide/",false],
["09","SEVEN STYLES - Motion Loops","Guide 09/16: Janus Tiu's seven motion styles, all in canvas","09-seven-styles/",false],
["10","FORGE - Template Studio","Guide 17: the Hyliox prompt, executed to the letter","10-forge/",false],
["11","PROMPTBOOK - A Tiny Prompt Library","Guide 23: Budarina-style curated prompts with copy buttons","11-promptbook/",false],
["12","GRIMHAVEN - A Dark Fantasy Theme","Guide 24: Divya-style themed world, original IP","12-grimhaven/",false]
];
document.getElementById('grid').innerHTML=P.map(p=>
`<a class="card ${p[4]?'':'soon'}" href="${p[4]?p[3]:'#'}"><span class="num">${p[0]}</span><span><h2>${p[1]}</h2><p>${p[2]}</p></span><span class="arrow">${p[4]?'&rarr;':'soon'}</span></a>`).join('');
</script>
</body>
</html>
